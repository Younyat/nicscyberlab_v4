<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NICS CyberLab | Industrial Traffic Inspector</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      background: #020617;
      color: #f1f5f9;
      overflow: hidden;
    }

    .glass {
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(51, 65, 85, 0.5);
      border-radius: 1rem;
    }

    .packet-card { border-left: 4px solid transparent; }
    .packet-card:hover { border-left-color: #38bdf8; background: rgba(255,255,255,0.03); }
    .packet-card .details { display: none; }
    .packet-card.active .details { display: block; }

    #packet-flow::-webkit-scrollbar { width: 4px; }
    #packet-flow::-webkit-scrollbar-thumb { background: #38bdf8; border-radius: 10px; }
  </style>
</head>

<body class="p-6 h-screen">

  <div class="grid grid-cols-12 gap-6 h-full">

    <!-- ================= LEFT: INVENTORY CONTEXT ================= -->
    <aside class="col-span-3 glass p-5 flex flex-col overflow-hidden">
      <h2 class="text-[10px] font-black tracking-[0.25em] text-sky-400 mb-4 uppercase">
        Inventory Context
      </h2>

      <div id="node-list" class="space-y-3 overflow-y-auto pr-1 flex-1">
        <!-- LLENADO DINÁMICO DESDE STATE.instances -->
      </div>

      <div class="mt-6 pt-4 border-t border-slate-800">
        <div class="text-[9px] text-slate-500 font-bold uppercase mb-2">
          Network Segment
        </div>
        <div class="text-xs font-mono bg-black/40 p-2 rounded border border-slate-800 text-sky-300">
          vNet: internal_industrial_01<br>
          CIDR: 10.0.2.0/24
        </div>
      </div>
    </aside>

    <!-- ================= RIGHT: TRAFFIC ================= -->
    <section class="col-span-9 glass p-6 flex flex-col overflow-hidden">

      <!-- HEADER -->
      <div class="flex justify-between items-center mb-4">
        <div>
          <h1 class="text-lg font-bold text-white">
            Industrial Traffic Inspector
          </h1>
          <p class="text-xs text-slate-400">
            Captura en tiempo real · Modbus TCP
          </p>
        </div>

        <div class="flex items-center gap-3 bg-slate-900/80 px-4 py-2 rounded-full border border-slate-800">
          <div class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></div>
          <span class="text-[10px] font-black tracking-widest text-emerald-400 uppercase">
            Live
          </span>
        </div>
      </div>

      <!-- TABLE HEADER -->
      <div class="grid grid-cols-12 px-3 mb-2 text-[9px] font-black text-slate-500 uppercase tracking-widest">
        <div class="col-span-2">Time</div>
        <div class="col-span-4">Source</div>
        <div class="col-span-4">Destination</div>
        <div class="col-span-2 text-right">Function</div>
      </div>

      <!-- PACKET FLOW -->
      <div id="packet-flow" class="flex-1 overflow-y-auto space-y-2 pr-2">
        <!-- PAQUETES REALES ENTRANTES -->
      </div>

    </section>
  </div>

  <!-- ================= CONTROLS (HIDDEN BUT REQUIRED) ================= -->
  <button id="btn-refresh" class="hidden"></button>

  <!-- ================= JS ================= -->
  <script src="modbus_traffic.js"></script>

</body>
</html>
