#cloud-config

output:
  all: '| tee -a /var/log/cloud-init-output.log | tee /dev/console'

package_update: true
package_upgrade: false

packages:
  - git
  - build-essential
  - cmake
  - python3
  - python3-pip
  - tcpdump
  - iproute2
  - curl
  - dos2unix
  - netcat-openbsd

write_files:
  # ---------------------------------------------------------
  # 1. PLC PROGRAM (TankSimple – escenario ICS cybersecurity)
  # ---------------------------------------------------------
  - path: /opt/plc_program.st
    permissions: '0644'
    content: |
      PROGRAM TankSimple
        VAR
          (* Actuador *)
          openOutletValve AT %QX0.1 : BOOL;

          (* Sensor digital de estado *)
          outletValveOpenStatus AT %QX0.3 : BOOL;

          (* Actuador *)
          openInletValve AT %QX0.4 : BOOL;

          (* Sensor digital de estado *)
          inletValveOpenStatus AT %QX0.5 : BOOL ;

          (* Sensor analógico *)
          level AT %QW2 : INT;

          (* Nivel máximo / umbral *)
          level_max AT %QW3 : INT;

          airValveOpenStatus AT %QX0.6 : BOOL;
        END_VAR

        IF level > level_max AND airValveOpenStatus THEN
          openOutletValve := TRUE;
          outletValveOpenStatus := TRUE;
          openInletValve := FALSE;
          inletValveOpenStatus := FALSE;
          level := level - 1;
        END_IF;

        IF level < level_max AND airValveOpenStatus THEN
          openOutletValve := FALSE;
          outletValveOpenStatus := FALSE;
          openInletValve := TRUE;
          inletValveOpenStatus := TRUE;
          level := level + 1;
        END_IF;

        IF level = level_max THEN
          openOutletValve := FALSE;
          outletValveOpenStatus := FALSE;
          openInletValve := FALSE;
          inletValveOpenStatus := FALSE;
        END_IF;

        IF level < 0 THEN level := 0; END_IF;
        IF level > 99 THEN level := 100; END_IF;
      END_PROGRAM

      CONFIGURATION Config0
        RESOURCE Res0 ON PLC
          TASK task0(INTERVAL := T#100ms, PRIORITY := 0);
          PROGRAM P0 WITH task0 : TankSimple;
        END_RESOURCE
      END_CONFIGURATION

  # ---------------------------------------------------------
  # 2. PYTHON HELPER: register TankSimple in OpenPLC DB
  #    (kept as a separate file to avoid YAML heredoc issues)
  # ---------------------------------------------------------
  - path: /opt/register_plc_db.py
    permissions: '0755'
    content: |
      import sqlite3, time, sys
      db = "/opt/OpenPLC_v3/webserver/openplc.db"
      try:
          conn = sqlite3.connect(db)
          conn.execute("DELETE FROM Programs WHERE File='active_program.st'")
          conn.execute(
              "INSERT INTO Programs (Name,Description,File,Date_upload) VALUES (?,?,?,?)",
              ("TankSimple", "TankSimple ICS scenario - level_max at QW3 (T0831)", "active_program.st", int(time.time()))
          )
          conn.execute("UPDATE Settings SET Value='true' WHERE Key='Start_run_mode'")
          conn.commit()
          conn.close()
          print("[PLC] DB: TankSimple registered, Start_run_mode=true")
      except Exception as e:
          print(f"[PLC] DB ERROR: {e}", file=sys.stderr)
          sys.exit(1)

  # ---------------------------------------------------------
  # 3. SCRIPT PARA CARGAR Y COMPILAR EL PROGRAMA IEC
  # ---------------------------------------------------------
  - path: /opt/load_plc.sh
    permissions: '0755'
    content: |
      #!/bin/bash
      set -u
      OPENPLC_DIR="/opt/OpenPLC_v3/webserver"
      PLC_SOURCE="/opt/plc_program.st"

      echo "[PLC] Waiting for OpenPLC directories..."
      while [ ! -d "$OPENPLC_DIR/st_files" ]; do
          sleep 3
      done

      echo "[PLC] Copying program..."
      cp "$PLC_SOURCE" "$OPENPLC_DIR/st_files/active_program.st"

      echo "[PLC] Compiling program..."
      cd "$OPENPLC_DIR/scripts"
      if [ -f "./compile_program.sh" ]; then
        ./compile_program.sh active_program.st
      elif [ -f "./compile_st.sh" ]; then
        ./compile_st.sh active_program.st
      else
        echo "[PLC] ERROR: no compile script found in $OPENPLC_DIR/scripts"
        ls "$OPENPLC_DIR/scripts/" || true
      fi

      echo "[PLC] Registering TankSimple in OpenPLC database..."
      python3 /opt/register_plc_db.py

      echo "[PLC] Restarting OpenPLC service..."
      systemctl restart openplc

      echo "[PLC] Waiting for Modbus TCP port 502 to be ready..."
      timeout=120
      elapsed=0
      while ! nc -z 127.0.0.1 502 2>/dev/null; do
        sleep 3
        elapsed=$((elapsed + 3))
        if [ $elapsed -ge $timeout ]; then
          echo "[PLC] WARNING: Modbus port 502 not ready after ${timeout}s"
          break
        fi
      done
      echo "[PLC] Modbus TCP ready (elapsed: ${elapsed}s)"
      echo "[PLC] Program loaded successfully"

runcmd:
  # ---------------------------------------------------------
  # 0. CLEAN PREVIOUS INSTALLATION
  # ---------------------------------------------------------
  - echo "[0] Cleaning previous OpenPLC installation"
  - rm -rf /opt/OpenPLC_v3

  # ---------------------------------------------------------
  # 1. INSTALL OPENPLC
  # ---------------------------------------------------------
  - echo "[1] Installing OpenPLC"
  - cd /opt
  - git clone https://github.com/thiagoralves/OpenPLC_v3.git
  - cd OpenPLC_v3
  - ./install.sh linux

  # ---------------------------------------------------------
  # 2. DEPLOY PLC PROGRAM
  # ---------------------------------------------------------
  - echo "[2] Copying PLC program"
  - cp /opt/plc_program.st /opt/OpenPLC_v3/webserver/st_files/

  # ---------------------------------------------------------
  # 3. ENABLE MODBUS SERVER (PLC AS MASTER)
  # ---------------------------------------------------------
  - echo "[3] Configuring Modbus"
  - |
    cat > /opt/OpenPLC_v3/webserver/settings.ini <<EOF
    [Modbus]
    Enabled = true
    Port = 502
    Address = 0.0.0.0
    EOF

  # ---------------------------------------------------------
  # 4. START OPENPLC SERVICE
  # ---------------------------------------------------------
  - echo "[4] Starting OpenPLC service"
  - systemctl daemon-reexec
  - systemctl restart openplc

  # ---------------------------------------------------------
  # 5. LOAD PLC PROGRAM
  # ---------------------------------------------------------
  - echo "[5] Loading program into OpenPLC"
  - bash /opt/load_plc.sh

  # ---------------------------------------------------------
  # FINAL FLAG
  # ---------------------------------------------------------
  - echo "[FINAL] PLC READY (MASTER CONFIGURED)"
  - touch /opt/PLC_READY

final_message: |
  OpenPLC TankSimple installation complete.
  -----------------------------------------
  Program: TankSimple (TankControl.st)
  Modbus TCP: port 502 (verified ready)

  Registers exposed (Modbus holding registers):
    %QW2 (HR2) → level
    %QW3 (HR3) → level_max   ← attack target T0831
    %QX0.1     → openOutletValve
    %QX0.4     → openInletValve

  Scenario ready for Level B attacks (T0831_MANIPULATION_OF_CONTROL_MODBUS).
