<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cybersecurity Scenario Editor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.0/cytoscape.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script>document.documentElement.setAttribute('data-theme', (function(){try{return localStorage.getItem('nics-cyberlab-theme')||'dark';}catch(e){return 'dark';}})());</script>
    <link rel="stylesheet" href="/css/theme.css">
    <link rel="stylesheet" href="css/style-scenario.css">
    <style>
        #cy {
            height: 600px; /* fixed canvas height, adjust as needed */
            width: 80%;;
        }
        #terminal {
            height: calc(600px * 0.3); /* 30% of #cy's height */
            width: 80%;
        }
    </style>
</head>
<body>
    <div id="app-container" class="flex min-h-screen p-4">
        <div class="flex-1 flex flex-col overflow-y-auto max-h-screen">

            <div class="scenario-header">
                <div class="brand">
                    <div class="brand-icon"><i class="fas fa-network-wired"></i></div>
                    <div>
                        <div class="brand-title">IT Scenario Editor</div>
                        <div class="brand-subtitle">Design &bull; Simulate &bull; Secure</div>
                    </div>
                </div>
                <div id="theme-switcher-mount"></div>
            </div>

            <div id="cy" class="flex-1"></div>

            <div id="terminal">
                <div class="terminal-titlebar">
                    <div class="terminal-label"><i class="fas fa-terminal"></i> Terminal</div>
                    <div class="terminal-dots"><span></span><span></span><span></span></div>
                </div>
                <div id="terminal-output" class="h-[calc(600px*0.3-70px)] overflow-y-auto font-mono text-sm text-white"></div>
            </div>
        </div>

        <div id="controls-panel" class="ml-4">

            <div class="panel-card p-4 mb-6">
                <h2 class="panel-section-title mb-3">Statistics</h2>
                <div class="flex justify-around text-center">
                    <div class="stat-block">
                        <p class="stat-value stat-nodes" id="nodeCount">0</p>
                        <p class="stat-label">Nodes</p>
                    </div>
                    <div class="stat-block">
                        <p class="stat-value stat-edges" id="edgeCount">0</p>
                        <p class="stat-label">Connections</p>
                    </div>
                </div>
            </div>

            <h2 class="panel-section-title mb-3">Quick Add</h2>
            <div class="grid grid-cols-4 gap-3 mb-6">
                <button onclick="addNodeMode('monitor')" class="btn-mode bg-teal-700/70 hover:bg-teal-600 text-white">
                    <i class="fas fa-shield-alt"></i>
                    <span>Monitor</span>
                </button>

                <button onclick="addNodeMode('attack')" class="btn-mode bg-red-700/70 hover:bg-red-600 text-white">
                    <i class="fas fa-bolt"></i>
                    <span>Attack</span>
                </button>

                <button onclick="addNodeMode('victim')" class="btn-mode bg-blue-700/70 hover:bg-blue-600 text-white">
                    <i class="fas fa-crosshairs"></i>
                    <span>Victim</span>
                </button>

                <button onclick="toggleConnectionMode()" class="btn-mode btn-connect bg-orange-700/70 hover:bg-orange-600 text-white">
                    <i class="fas fa-link"></i>
                    <span>Connect</span>
                </button>
            </div>

            <div class="flex space-x-3 mb-8">
                <button onclick="deleteSelected()" class="btn-action btn-neutral">
                    <i class="fas fa-trash-alt"></i> Delete Selected
                </button>

                <button onclick="showClearConfirmation()" class="btn-action btn-danger-soft">
                    <i class="fas fa-eraser"></i> Clear All
                </button>
            </div>

            <div class="panel-card p-4 mb-6">
                <h2 class="panel-section-title mb-4">Node Properties</h2>

                <div class="grid grid-cols-2 gap-3 mb-3">

                    <div>
                        <label for="nodeNetwork" class="field-label">Primary Network</label>
                        <select id="nodeNetwork" onchange="updateNodeProperties(false)" class="field-select">
                            <option value="net_private_01">net_private_01</option>
                            <option value="net_external_01">net_external_01</option>
                        </select>
                    </div>

                    <div>
                        <label for="nodeSubNetwork" class="field-label">Primary Subnetwork</label>
                        <select id="nodeSubNetwork" onchange="updateNodeProperties(false)" class="field-select">
                            <option value="subnet_net_private_01">subnet_net_private_01</option>
                            <option value="subnet_net_external_01">subnet_net_external_01</option>
                        </select>
                    </div>

                    <div>
                        <label for="nodeImage" class="field-label">Image</label>
                        <select id="nodeImage" onchange="updateNodeProperties(false)" class="field-select">
                            <option value="ubuntu-22.04">ubuntu-22.04</option>
                            <option value="debian-12">debian-12</option>
                            <option value="kali-linux">kali-linux</option>
                        </select>
                    </div>

                    <div>
                        <label for="nodeFlavor" class="field-label">Flavor</label>
                        <select id="nodeFlavor" onchange="updateNodeProperties(false)" class="field-select">
                            <option value="T_1CPU_2GB">T_1CPU_2GB</option>
                            <option value="S_2CPU_4GB">S_2CPU_4GB</option>
                            <option value="M_4CPU_8GB">M_4CPU_8GB</option>
                            <option value="L_6CPU_12GB">L_6CPU_12GB</option>
                        </select>
                    </div>

                </div>

                <div class="grid grid-cols-2 gap-3">

                    <div>
                        <label for="nodeSecurityGroup" class="field-label">Security Group</label>
                        <select id="nodeSecurityGroup" onchange="updateNodeProperties(false)" class="field-select">
                            <option value="sg_basic">sg_basic</option>
                        </select>
                    </div>

                    <div>
                        <label for="nodeSSHKey" class="field-label">SSH Key</label>
                        <select id="nodeSSHKey" onchange="updateNodeProperties(false)" class="field-select">
                            <option value="my_key">my_key</option>
                        </select>
                    </div>

                </div>
            </div>

            <div class="mb-8">
                <button onclick="updateNodeProperties()" id="update-node-btn" disabled
                    class="btn-action text-white cursor-not-allowed bg-yellow-600/50">
                    <i class="fas fa-sync-alt"></i> Update Selected Node
                </button>
            </div>

            <div class="panel-card p-6">

                <h2 class="panel-section-title mb-5 text-center">Scenario Integration</h2>

                <div class="flex flex-col space-y-3">

                    <button onclick="newScenarioConfirmation()" class="btn-action btn-primary">
                        <i class="fas fa-download"></i> Create Scenario
                    </button>

                    <button onclick="loadScenario()" class="btn-action btn-primary-dim">
                        <i class="fas fa-upload"></i> Load Scenario
                    </button>

                    <button onclick="destruirScenarioConfirmation()" class="btn-action btn-danger
                                   focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-offset-2 focus:ring-offset-[#12172a]">
                        <i class="fas fa-exclamation-triangle"></i> Destroy Scenario
                    </button>

                </div>
            </div>

        </div>
    </div>

    <div id="toast">Test message</div>

    <div id="customModal" class="modal-overlay hidden">
        <div class="modal-content">
            <h3 id="modalTitle" class="text-xl font-bold mb-4">Confirm Action</h3>
            <p id="modalMessage" class="text-gray-300 mb-6">Are you sure you want to proceed?</p>

            <div class="flex justify-center space-x-4">
                <button id="modalCancel" class="btn-action btn-neutral" style="width:auto;padding-left:1.5rem;padding-right:1.5rem;">
                    Cancel
                </button>

                <button id="modalConfirm" class="btn-action btn-danger-soft" style="width:auto;padding-left:1.5rem;padding-right:1.5rem;">
                    Confirm
                </button>
            </div>
        </div>
    </div>

    <script src="js/script.js"></script>

<div id="overlay" class="hidden fixed inset-0 bg-black/70 z-50 flex items-center justify-center">
  <div class="text-white text-2xl font-bold animate-pulse">
     Deploying / Destroying scenario... please wait a few minutes.
  </div>
</div>

<script>
window.addEventListener('load', () => {
    if (typeof loadScenario === 'function') {
        loadScenario();
    }
});
</script>

<script src="/js/theme-switcher.js"></script>
<script>window.NicsThemeSwitcher.mount('#theme-switcher-mount');</script>

</body>
</html>
