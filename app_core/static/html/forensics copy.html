<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>NICS CyberLab — DFIR Forensics</title>

  <!-- Si ya usas Tailwind en tu proyecto, elimina este <style> y aplica tus clases -->
  <style>
    :root { --bg:#070b10; --card:#0c1420; --fg:#e8eef7; --mut:#93a4bc; --line:#16304a; --ok:#38d39f; --bad:#ff5d5d; }
    body { margin:0; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; background:var(--bg); color:var(--fg); }
    .wrap { max-width:1100px; margin:0 auto; padding:24px; }
    h1 { margin:0 0 18px; font-size:20px; letter-spacing:.5px; }
    .grid { display:grid; grid-template-columns: 1fr; gap:14px; }
    @media (min-width: 980px){ .grid { grid-template-columns: 1fr 1fr; } }
    .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; }
    .card h2 { margin:0 0 10px; font-size:14px; color:var(--mut); text-transform:uppercase; letter-spacing:1px; }
    .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
    label { display:block; font-size:12px; color:var(--mut); margin:10px 0 6px; }
    input, select, textarea {
      width:100%; box-sizing:border-box;
      background:#060b12; border:1px solid var(--line); color:var(--fg);
      border-radius:10px; padding:10px 12px; outline:none;
    }
    textarea { min-height:110px; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
    button {
      background:#0c2238; color:var(--fg); border:1px solid var(--line);
      padding:10px 12px; border-radius:10px; cursor:pointer;
    }
    button.primary { background:#12365a; }
    button:disabled { opacity:.5; cursor:not-allowed; }
    .kv { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; font-size:12px; color:#cfe2ff; }
    .mut { color:var(--mut); font-size:12px; }
    .ok { color:var(--ok); }
    .bad { color:var(--bad); }
    .hr { height:1px; background:var(--line); margin:12px 0; }
    .pill { display:inline-flex; gap:8px; align-items:center; padding:6px 10px; border-radius:999px; border:1px solid var(--line); background:#06101a; font-size:12px; color:var(--mut); }
    .log { white-space:pre-wrap; word-break:break-word; }
    a { color:#9fd0ff; text-decoration:none; }
    a:hover { text-decoration:underline; }
    .table { width:100%; border-collapse:collapse; margin-top:8px; }
    .table th, .table td { border-bottom:1px solid var(--line); padding:8px; font-size:12px; text-align:left; }
    .table th { color:var(--mut); font-weight:600; }
  </style>
</head>

<body>
  <div class="wrap">
    <h1>NICS CyberLab — DFIR Forensics</h1>

    <div class="row" style="margin-bottom:14px;">
      <span class="pill">Case: <span id="case_dir" class="kv">—</span></span>
      <button id="btn_create_case" class="primary">Create Case</button>
      <button id="btn_refresh_manifest">Refresh Manifest</button>
    </div>

    <div class="grid">
      <!-- Acquire Disk -->
      <div class="card">
        <h2>Acquire Disk (Kolla / libvirt)</h2>
        <label>Instance UUID</label>
        <input id="disk_instance_uuid" placeholder="16583180-627d-4c40-bd65-aa9db704d75c" />

        <label>Container Name</label>
        <input id="disk_container_name" value="nova_libvirt" />

        <div class="row" style="margin-top:12px;">
          <button id="btn_acquire_disk" class="primary">Acquire Disk (RAW)</button>
        </div>

        <div class="hr"></div>
        <div class="mut">Result</div>
        <div class="kv" id="disk_result">—</div>
      </div>

      <!-- Acquire Memory -->
      <div class="card">
        <h2>Acquire Memory (LiME over SSH)</h2>

        <label>Victim VM IP (reachable from forensic host)</label>
        <input id="mem_vm_ip" placeholder="10.0.2.172" />

        <label>SSH User</label>
        <input id="mem_ssh_user" value="debian" />

        <label>SSH Key Path (server-side path)</label>
        <input id="mem_ssh_key" value="/home/younes/.ssh/my_key" />

        <label>Mode</label>
        <select id="mem_mode">
          <option value="build">build (compile LiME each run)</option>
          <option value="use_existing">use_existing</option>
        </select>

        <div class="row" style="margin-top:12px;">
          <button id="btn_acquire_memory" class="primary">Acquire Memory (LiME)</button>
        </div>

        <div class="hr"></div>
        <div class="mut">Result</div>
        <div class="kv" id="mem_result">—</div>
      </div>

      <!-- Analyze Memory -->
      <div class="card">
        <h2>Analyze Memory (Volatility 3)</h2>

        <label>Dump file (auto-filled)</label>
        <input id="vol_dump_file" placeholder="/path/to/memdump....lime" />

        <label>Symbols dir</label>
        <input id="vol_symbols_dir" placeholder="/.../memory_dumps/symbols/linux" />

        <label>Volatility command</label>
        <input id="vol_cmd" value="vol" />

        <div class="row" style="margin-top:12px;">
          <button id="btn_analyze_memory" class="primary">Run Volatility</button>
        </div>

        <div class="hr"></div>
        <div class="mut">Result</div>
        <div class="kv" id="vol_result">—</div>
      </div>

      <!-- Manifest / Artifacts -->
      <div class="card">
        <h2>Case Manifest & Downloads</h2>
        <div class="mut">Artifacts</div>

        <table class="table" id="artifacts_table">
          <thead>
            <tr>
              <th>Type</th>
              <th>Relative path</th>
              <th>SHA-256</th>
              <th>Download</th>
            </tr>
          </thead>
          <tbody>
            <tr><td colspan="4" class="mut">No manifest loaded.</td></tr>
          </tbody>
        </table>

        <div class="hr"></div>
        <div class="mut">Raw manifest (debug)</div>
        <textarea id="manifest_raw" readonly class="log">—</textarea>
      </div>
    </div>

    <div class="card" style="margin-top:14px;">
      <h2>Console</h2>
      <div class="row">
        <button id="btn_clear_console">Clear</button>
      </div>
      <div class="hr"></div>
      <textarea id="console" readonly class="log"></textarea>
    </div>

  </div>

  <script src="/static/js/forensics_ui.js"></script>
</body>
</html>
