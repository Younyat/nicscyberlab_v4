<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NICS CyberLab | OT Command Center</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Roboto+Mono:wght@400;600&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg0:#070A10; --bg1:#0B1220; --glass: rgba(18, 29, 46, .55);
      --line: rgba(120, 170, 220, .18); --line2: rgba(120, 170, 220, .28);
      --cyan:#39E6FF; --amber:#FFB020; --crimson:#FF2D55;
      --ok:#22c55e; --warn:#f59e0b; --bad:#ef4444; --muted:#9fb3c8;
    }
    body{
      font-family: Inter, sans-serif;
      background: radial-gradient(1200px 600px at 70% -10%, rgba(57,230,255,.12), transparent 55%),
                  linear-gradient(180deg, var(--bg0), var(--bg1));
      color: #e7f0ff; overflow: hidden; height: 100vh;
    }
    .mono{ font-family: "Roboto Mono", monospace; }
    .glass{
      background: linear-gradient(180deg, rgba(18, 29, 46, .66), rgba(18, 29, 46, .38));
      border: 1px solid var(--line2); backdrop-filter: blur(10px); border-radius: 14px;
    }
    .panel-title{ letter-spacing: .08em; text-transform: uppercase; font-weight: 800; font-size: .86rem; }
    .tab-btn{ border: 1px solid rgba(120, 170, 220, .22); background: rgba(9, 15, 26, .55); transition: all .18s ease; }
    .tab-btn.active{ border-color: var(--cyan); box-shadow: 0 0 20px rgba(57,230,255,.2); color: #fff; }
    .ability{ border: 1px solid rgba(120,170,220,.24); background: rgba(6,10,18,.4); cursor: grab; }
    .kill-slot{ border: 1px dashed rgba(120,170,220,.28); background: rgba(6,10,18,.28); transition: all .2s; }
    .kill-slot.dragover{ border-color: var(--amber); background: rgba(255,176,32,.05); }
    .status-pill{ font-size: .72rem; padding: 2px 8px; border-radius: 99px; border: 1px solid rgba(120,170,220,.2); }
    .pill-warn{ color: var(--warn); border-color: rgba(245,158,11,.3); }
    .pill-bad{ color: var(--bad); border-color: rgba(239,68,68,.3); }
    .node{
      position: absolute; width: 170px; padding: 10px; border-radius: 12px;
      border: 1px solid rgba(120,170,220,.25); background: rgba(10,16,28,.7);
      transition: border-color .2s, box-shadow .2s; cursor: pointer;
    }
    .node.locked{ border-color: var(--amber); box-shadow: 0 0 20px rgba(255,176,32,.2); }
    .node .k{ font-size: 10px; text-transform: uppercase; opacity: 0.6; font-weight: 800; }
    .node .v{ font-size: 13px; font-weight: 800; }
    .node .s{ font-size: 10px; opacity: 0.7; }
    .role-pill{ font-size: 9px; padding: 1px 6px; border-radius: 4px; border: 1px solid rgba(120,170,220,.2); }
    .role-attacker{ color: var(--crimson); border-color: var(--crimson); }
    .role-plc{ color: var(--amber); border-color: var(--amber); }
    .grid-overlay{
      position: absolute; inset: 0; pointer-events: none;
      background-image: linear-gradient(to right, rgba(120,170,220,.05) 1px, transparent 1px),
                        linear-gradient(to bottom, rgba(120,170,220,.05) 1px, transparent 1px);
      background-size: 40px 40px; mask-image: radial-gradient(circle, black, transparent 80%);
    }
    .ctx{ position: fixed; z-index: 999; background: rgba(8,12,22,.95); border: 1px solid var(--line2); display: none; border-radius: 8px; padding: 10px; }
  </style>
</head>

<body class="p-4 overflow-hidden">
  <header class="flex items-center justify-between mb-4">
    <div class="flex items-center gap-4">
      <div class="glass px-4 py-2 flex items-center gap-3">
        <div class="w-2.5 h-2.5 rounded-full bg-cyan-400 animate-pulse"></div>
        <span class="text-sm font-extrabold tracking-tighter">NICS CYBERLAB / OT HUD</span>
      </div>
      <div class="mono text-xs opacity-60" id="clock">00:00:00</div>
    </div>
    <div class="flex gap-2">
      <div class="glass px-3 py-1 text-[10px] mono">SYSTEM: ONLINE</div>
      <div class="glass px-3 py-1 text-[10px] mono">NET: 10.0.1.x</div>
    </div>
  </header>

  <main class="grid grid-cols-12 gap-4 h-[calc(100vh-100px)]">
    <aside class="col-span-3 glass p-4 flex flex-col gap-4">
      <div class="panel-title">Arsenal / Kill Chain</div>
      <div class="flex gap-1">
        <button class="tab-btn flex-1 py-1 text-[10px] active" data-proto="modbus">MODBUS</button>
        <button class="tab-btn flex-1 py-1 text-[10px]" data-proto="s7">S7</button>
        <button class="tab-btn flex-1 py-1 text-[10px]" data-proto="bacnet">BACNET</button>
      </div>
      <div id="abilities" class="flex flex-col gap-2 overflow-y-auto max-h-48"></div>
      
      <div class="mt-auto flex flex-col gap-2">
        <div class="text-[10px] mono opacity-50 uppercase flex justify-between">
          <span>Kill Chain</span>
          <button id="clearChain" class="hover:text-white">Reset</button>
        </div>
        <div class="kill-slot rounded-lg p-2 text-center" data-slot="1"><div class="mono text-[10px] opacity-40">STEP 1</div></div>
        <div class="kill-slot rounded-lg p-2 text-center" data-slot="2"><div class="mono text-[10px] opacity-40">STEP 2</div></div>
        <div class="kill-slot rounded-lg p-2 text-center" data-slot="3"><div class="mono text-[10px] opacity-40">STEP 3</div></div>
        <button id="btnEngage" class="w-full bg-rose-600/20 border border-rose-500/50 py-3 rounded-lg text-xs font-bold hover:bg-rose-600/40 transition">EXECUTE ENGAGEMENT</button>
      </div>
    </aside>

    <section class="col-span-6 glass relative overflow-hidden" id="topoCanvas">
      <div class="grid-overlay"></div>
      <div class="absolute top-4 left-4 z-10">
        <div class="text-[10px] mono text-amber-500 font-bold" id="alertText">NO TARGET SELECTED</div>
      </div>
      <div id="topoWorld" class="w-full h-full relative">
        <svg class="absolute inset-0 w-full h-full pointer-events-none">
          <g id="linksLayer"></g>
        </svg>
        <div id="nodesLayer" class="absolute inset-0"></div>
      </div>
    </section>

    <aside class="col-span-3 flex flex-col gap-4">
      <div class="glass p-4 flex-1 overflow-hidden">
        <div class="panel-title mb-4">Instance Intel</div>
        <div id="intelBox" class="mono text-[11px] opacity-80 leading-relaxed"></div>
      </div>
      <div class="glass p-4 h-1/3 overflow-hidden flex flex-col">
        <div class="flex justify-between items-center mb-2">
          <span class="panel-title">Logs</span>
          <button id="clearLogs" class="text-[10px] opacity-50">Clear</button>
        </div>
        <div id="logs" class="overflow-y-auto flex-1 flex flex-col gap-1"></div>
      </div>
    </aside>
  </main>

  <div id="contextMenu" class="ctx mono text-xs w-48">
    <div id="ctxTitle" class="font-bold border-b border-white/10 pb-2 mb-2"></div>
    <div id="ctxBody" class="flex flex-col gap-1"></div>
  </div>

  


<script>
// ============================================================
// HUD OPERATIONAL STATE & STATUS
// ============================================================
let HUD_STATE = "IDLE"; 

function setHudState(state, reason = "") {
  const el = document.getElementById("alertText");
  if (!el) return;

  el.classList.remove("text-amber-400", "text-rose-400", "text-slate-200/80");

  if (state === "IDLE") {
    el.textContent = "No active engagement";
    el.classList.add("text-slate-200/80");
  } else if (state === "TRACKING") {
    el.textContent = `Tracking${reason ? ": " + reason : ""}`;
    el.classList.add("text-amber-400");
  } else if (state === "ENGAGED") {
    el.textContent = `ENGAGED${reason ? ": " + reason : ""}`;
    el.classList.add("text-rose-400");
  }
}

// ============================================================
// Data (Abilities & Kill Chain)
// ============================================================
const ABILITIES = {
  modbus: [
    { id:"mb_scan", name:"Modbus Discover", tag:"Recon", severity:"warn" },
    { id:"mb_read", name:"Read Holding Regs", tag:"Exfil", severity:"warn" },
    { id:"mb_write", name:"Write Single Coil", tag:"Impact", severity:"bad" },
    { id:"mb_flood", name:"Modbus Flood", tag:"DoS", severity:"bad" }
  ],
  bacnet: [
    { id:"bn_discover", name:"BACnet Discover", tag:"Recon", severity:"warn" },
    { id:"bn_read", name:"Read Objects", tag:"Exfil", severity:"warn" }
  ],
  dnp3: [
    { id:"dnp_scan", name:"DNP3 Enumerate", tag:"Recon", severity:"warn" }
  ],
  s7: [
    { id:"s7_info", name:"S7 Info", tag:"Recon", severity:"warn" },
    { id:"s7_stop", name:"Stop PLC", tag:"Impact", severity:"bad" }
  ]
};

const KILL_CHAIN = [
  { slot: 1, value: null },
  { slot: 2, value: null },
  { slot: 3, value: null }
];

let currentProto = "modbus";
let selectedTarget = null;
let selectedTargetId = null;
let selectedTargetNodeEl = null;
let hudInstances = [];

// Pan & Drift State
let panX = 0, panY = 0;
let panning = false;
let panStart = {x:0, y:0};
let panBase = {x:0, y:0};
const driftState = new Map(); 

// ============================================================
// Helpers
// ============================================================
const $ = (id) => document.getElementById(id);

function nowTS(){
  const d = new Date();
  const pad = (n) => String(n).padStart(2,"0");
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}

function pillClass(sev){
  return sev === "ok" ? "pill-ok" : sev === "warn" ? "pill-warn" : "pill-bad";
}

function severityMark(sev){
  return sev === "warn" ? "WARN" : sev === "bad" ? "CRIT" : "OK";
}

function roleClass(role){
  const classes = {
    attacker: "role-attacker",
    monitor: "role-monitor",
    plc: "role-plc",
    scada: "role-scada",
    victim: "role-victim"
  };
  return classes[role] || "";
}

function safeText(s){ return (s ?? "").toString(); }

// ============================================================
// Logs
// ============================================================
function pushLog(state, msg){
  const row = document.createElement("div");
  row.className = "log-row rounded-xl p-2 flex gap-2 items-start";
  const color = (state==="BLOCKED") ? "rgba(34,197,94,.95)" : (state==="ALLOWED") ? "rgba(239,68,68,.95)" : "rgba(245,158,11,.95)";

  row.innerHTML = `
    <div class="mono text-[11px] px-2 py-1 rounded-lg" style="border:1px solid rgba(120,170,220,.18); background: rgba(6,10,18,.28); color:${color}; min-width:84px; text-align:center;">
      ${state}
    </div>
    <div class="flex-1">
      <div class="mono text-[11px] text-slate-200/70">${nowTS()}</div>
      <div class="text-sm font-semibold text-slate-100/90">${msg}</div>
    </div>
  `;
  const logs = $("logs");
  if(logs) {
    logs.prepend(row);
    while(logs.children.length > 18) logs.removeChild(logs.lastChild);
  }
}

$("clearLogs")?.addEventListener("click", () => {
  $("logs").innerHTML = "";
  pushLog("DETECTED", "Log stream cleared");
});

// ============================================================
// Abilities & Kill Chain Logic
// ============================================================
function renderAbilities(){
  const box = $("abilities");
  if(!box) return;
  box.innerHTML = "";
  const list = ABILITIES[currentProto] || [];
  
  list.forEach(a => {
    const div = document.createElement("div");
    div.className = "ability rounded-xl p-3 flex flex-col gap-2";
    div.draggable = true;
    div.innerHTML = `
      <div class="flex items-center justify-between">
        <div class="text-xs font-extrabold tracking-wide text-slate-100/90">${a.name}</div>
        <div class="status-pill mono ${pillClass(a.severity)}">${a.tag}</div>
      </div>
      <div class="mono text-[11px] text-slate-200/70">${severityMark(a.severity)} id:${a.id}</div>
    `;
    div.addEventListener("dragstart", (e) => {
      e.dataTransfer.setData("text/plain", JSON.stringify({ type:"ability", proto: currentProto, abilityId: a.id }));
      $("dropHint")?.classList.remove("hidden");
    });
    div.addEventListener("dragend", () => $("dropHint")?.classList.add("hidden"));
    box.appendChild(div);
  });
  if($("protoLabel")) $("protoLabel").textContent = `PROTO: ${currentProto.toUpperCase()}`;
}

document.querySelectorAll("[data-proto]").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll("[data-proto]").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentProto = btn.dataset.proto;
    renderAbilities();
    pushLog("DETECTED", `Protocol changed: ${currentProto.toUpperCase()}`);
  });
});

function renderKillChain(){
  const chainCount = KILL_CHAIN.filter(x => x.value).length;
  if($("chainLabel")) $("chainLabel").textContent = `${chainCount}/3`;

  document.querySelectorAll(".kill-slot").forEach(slotEl => {
    const slot = Number(slotEl.dataset.slot);
    const item = KILL_CHAIN.find(x => x.slot === slot);
    const hint = slotEl.querySelector(".mono.text-\\[11px\\].text-slate-300\\/70");
    if(hint) hint.textContent = item.value ? `Loaded: ${item.value.name}` : "Drop ability here";
  });
}

document.querySelectorAll(".kill-slot").forEach(slotEl => {
  slotEl.addEventListener("dragover", (e) => { e.preventDefault(); slotEl.classList.add("dragover"); });
  slotEl.addEventListener("dragleave", () => slotEl.classList.remove("dragover"));
  slotEl.addEventListener("drop", (e) => {
    e.preventDefault();
    slotEl.classList.remove("dragover");
    const payload = e.dataTransfer.getData("text/plain");
    if(!payload) return;
    const data = JSON.parse(payload);
    const ability = (ABILITIES[data.proto] || []).find(x => x.id === data.abilityId);
    if(ability) {
      KILL_CHAIN.find(x => x.slot === Number(slotEl.dataset.slot)).value = { ...ability, proto: data.proto };
      renderKillChain();
      pushLog("DETECTED", `Chain updated: ${ability.name}`);
    }
  });
});

// ============================================================
// HUD: CORE RENDERING
// ============================================================
async function loadHudInstances() {
  try {
    const res = await fetch("/api/hud/instances");
    const data = await res.json();
    hudInstances = data.instances || [];
    
    if (hudInstances.length === 0) {
      setHudState("IDLE");
    } else {
      setHudState("TRACKING", `${hudInstances.length} assets`);
      renderHUD();
    }
  } catch (e) {
    pushLog("ERROR", "Failed to fetch instances from OpenStack");
  }
}

function computeLayout(instances){
  const w = $("topoCanvas").clientWidth;
  const h = $("topoCanvas").clientHeight;
  const pos = new Map();

  const groups = { attacker:[], plc:[], scada:[], monitor:[], victim:[], unknown:[] };
  instances.forEach(i => (groups[i.role] || groups.unknown).push(i));

  const place = (list, x, y0, y1) => {
    const step = (y1 - y0) / (list.length + 1);
    list.forEach((it, idx) => pos.set(it.id, { x, y: y0 + step*(idx+1) }));
  };

  place(groups.attacker, w*0.12, h*0.2, h*0.8);
  place(groups.plc, w*0.4, h*0.2, h*0.6);
  place(groups.scada, w*0.85, h*0.2, h*0.8);
  place(groups.monitor, w*0.5, h*0.8, h*0.9);
  place(groups.victim, w*0.6, h*0.3, h*0.7);

  return pos;
}

function renderHUD(){
  const nodesLayer = $("nodesLayer");
  const linksLayer = $("linksLayer");
  nodesLayer.innerHTML = "";
  linksLayer.innerHTML = "";

  const layout = computeLayout(hudInstances);

  hudInstances.forEach(inst => {
    const p = layout.get(inst.id) || {x: 100, y: 100};
    
    // Drift init
    if(!driftState.has(inst.id)) {
      driftState.set(inst.id, { bx: p.x, by: p.y, phx: Math.random()*5, phy: Math.random()*5 });
    }

    const el = document.createElement("div");
    el.className = "node";
    el.dataset.instanceId = inst.id;
    el.style.left = `${p.x - 80}px`;
    el.style.top = `${p.y - 43}px`;

    el.innerHTML = `
      <div class="flex items-center justify-between">
        <div class="k">${inst.role}</div>
        <div class="role-pill ${roleClass(inst.role)} mono">${inst.role.toUpperCase()}</div>
      </div>
      <div class="v">${inst.name}</div>
      <div class="s mono">${inst.ip} | ${inst.status}</div>
    `;

    el.addEventListener("click", () => {
      lockTarget(inst, el);
      loadTargetDetail(inst.id);
    });

    // Context Menu
    el.addEventListener("contextmenu", (e) => {
      e.preventDefault();
      openContextMenu(e.clientX, e.clientY, inst);
    });

    nodesLayer.appendChild(el);
  });
  
  applyPan();
}

function lockTarget(inst, el){
  if(selectedTargetNodeEl) selectedTargetNodeEl.classList.remove("locked");
  selectedTarget = inst;
  selectedTargetNodeEl = el;
  el.classList.add("locked");
  if($("targetLabel")) $("targetLabel").textContent = inst.name;
}

async function loadTargetDetail(id){
  const r = await fetch(`/api/hud/instances/${id}`);
  const d = await r.json();
  const box = $("intelBox");
  if(box) {
    box.innerHTML = `<pre class="text-[10px] text-emerald-400/80">${JSON.stringify(d, null, 2)}</pre>`;
  }
}

function openContextMenu(x, y, inst){
  const ctx = $("contextMenu");
  if(!ctx) return;
  $("ctxTitle").textContent = inst.name;
  $("ctxSub").textContent = `IP: ${inst.ip}`;
  ctx.style.left = `${x}px`;
  ctx.style.top = `${y}px`;
  ctx.style.display = "block";
}

window.addEventListener("click", () => $("contextMenu").style.display = "none");

// ============================================================
// Animation & Systems
// ============================================================
function tickDrift(){
  const t = performance.now() / 1000;
  document.querySelectorAll(".node").forEach(el => {
    const st = driftState.get(el.dataset.instanceId);
    if(st){
      const dx = Math.sin(t + st.phx) * 2;
      const dy = Math.cos(t + st.phy) * 2;
      el.style.transform = `translate(${dx}px, ${dy}px)`;
    }
  });
  requestAnimationFrame(tickDrift);
}

function tickClock(){
  const d = new Date();
  const pad = (n)=>String(n).padStart(2,"0");
  if($("clock")) $("clock").textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}

function applyPan(){
  if($("topoWorld")) $("topoWorld").style.transform = `translate(${panX}px, ${panY}px)`;
}

// ============================================================
// INITIALIZATION
// ============================================================
renderAbilities();
renderKillChain();
pushLog("DETECTED", "OT Command Center (HUD) initialized");

setInterval(tickClock, 500);
tickClock();

// Función corregida para coincidir con la llamada
loadHudInstances(); 

requestAnimationFrame(tickDrift);
</script>
</body>
</html>
