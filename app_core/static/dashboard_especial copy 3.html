<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NICS CyberLab | Special Dashboard</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.0/cytoscape.min.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">

  <style>
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: 'Inter', sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .label-header {
      font-size: .65rem;
      font-weight: 900;
      letter-spacing: .3em;
      color: #64748b;
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    .dynamic-list {
      display: flex;
      flex-direction: column;
      gap: 15px;
      overflow-y: auto;
      padding: 20px;
      height: calc(100vh - 160px);
    }

    .strategy-card {
      background: rgba(255, 255, 255, .05);
      border: 1px solid rgba(255, 255, 255, .1);
      border-radius: 1.5rem;
      padding: 1.2rem;
      cursor: pointer;
      text-align: center;
      transition: .2s;
    }

    .strategy-card:hover {
      transform: translateX(8px);
      border-color: #60a5fa;
    }

    .tools-menu-center {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      background: rgba(30,41,59,.5);
      padding: 12px;
      border-radius: 2rem;
      border: 1px solid rgba(255,255,255,.1);
      margin-bottom: 10px;
    }

    .tool-btn {
      background: rgba(30,41,59,.7);
      border: 1px solid #475569;
      padding: .6rem 1.5rem;
      border-radius: 9999px;
      font-size: .75rem;
      font-weight: 800;
      text-transform: uppercase;
    }

    #terminal-output {
      font-family: 'Fira Code', monospace;
      font-size: .85rem;
      background: rgba(0,0,0,.85);
      border-radius: 1.5rem;
      padding: 16px;
      height: 220px;
      overflow-y: auto;
      color: #10b981;
      white-space: pre-wrap;
    }

    #cy-wrap {
      position: relative;
      overflow: hidden;
      border-radius: 3.5rem;
      border: 1px solid rgba(255,255,255,.05);
    }

    #cy {
      width: 100%;
      height: 100%;
    }

    .hint {
      font-size: 10px;
      color: #94a3b8;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    .node-info {
      font-size: 10px;
      font-family: 'Fira Code', monospace;
      color: #cbd5e1;
      text-align: right;
      white-space: pre-line;
    }
  </style>
</head>

<body>
<div class="flex flex-1 overflow-hidden pt-6">

  <!-- LEFT -->
  <aside class="w-80 border-r border-white/5 bg-black/10">
    <div class="p-4">
      <div class="label-header text-center">Attack Strategies</div>

      <div class="flex justify-between items-start mb-2">
        <div class="hint">Selecciona estrategia, luego nodo objetivo</div>
        <div id="attack-node-info" class="node-info"></div>
      </div>

      <div class="dynamic-list" id="attack-list"></div>
    </div>
  </aside>

  <!-- CENTER -->
  <main class="flex-1 flex flex-col px-6 gap-4">
    <div class="tools-menu-center">
      <button class="tool-btn" onclick="refreshBattlefield()">Refresh</button>
    </div>

    <div id="cy-wrap" class="flex-1">
      <div id="cy"></div>
    </div>

    <div class="pb-6">
      <div class="label-header ml-6">Live Execution Terminal</div>
      <div id="terminal-output">[SYSTEM] Dashboard listo</div>
    </div>
  </main>

  <!-- RIGHT -->
  <aside class="w-80 border-l border-white/5 bg-black/10">
    <div class="p-4">
      <div class="label-header text-center">Defense Strategies</div>

      <div class="flex justify-between items-start mb-2">
        <div class="hint">Selecciona estrategia, luego nodo objetivo</div>
        <div id="defense-node-info" class="node-info"></div>
      </div>

      <div class="dynamic-list" id="defense-list"></div>
    </div>
  </aside>

</div>

<script>
const API_BASE = "http://127.0.0.1:5001/api";
const attackInfo = document.getElementById("attack-node-info");
const defenseInfo = document.getElementById("defense-node-info");
const attackList = document.getElementById("attack-list");
const defenseList = document.getElementById("defense-list");
const terminal = document.getElementById("terminal-output");

let cy = null;
let selectedNodeData = null;

function log(msg){
  terminal.textContent += "\n" + msg;
  terminal.scrollTop = terminal.scrollHeight;
}

/* ===============================
   INFO DEL NODO + ESTRATEGIAS
   =============================== */
function renderNodeInfo(node){
  if(!node) return;

  const tools = node.tools || node.installed_tools || {};
  const strategies = node.strategies || { attack: [], defense: [] };

  const installed = Object.entries(tools)
    .map(([t]) => t)
    .join(", ");

  const txt =
`${node.name}
${(node.role||"unknown").toUpperCase()}
IP: ${node.ip||"N/A"}
TOOLS: ${installed || "none"}`;

  attackInfo.textContent = txt;
  defenseInfo.textContent = txt;

  // -------- ATAQUES --------
  attackList.innerHTML = "";
  (strategies.attack || []).forEach(a => {
    const div = document.createElement("div");
    div.className = "strategy-card";
    div.textContent = a;
    div.onclick = () => log(`[ATTACK] ${a} → ${node.name}`);
    attackList.appendChild(div);
  });

  if ((strategies.attack || []).length === 0) {
    attackList.innerHTML = `<div class="opacity-40 text-center text-xs">No attack actions</div>`;
  }

  // -------- DEFENSAS --------
  defenseList.innerHTML = "";
  (strategies.defense || []).forEach(d => {
    const div = document.createElement("div");
    div.className = "strategy-card";
    div.textContent = d;
    div.onclick = () => log(`[DEFENSE] ${d} → ${node.name}`);
    defenseList.appendChild(div);
  });

  if ((strategies.defense || []).length === 0) {
    defenseList.innerHTML = `<div class="opacity-40 text-center text-xs">No defense actions</div>`;
  }
}

/* ===============================
   CYTOSCAPE
   =============================== */
function initCy(){
  cy = cytoscape({
    container: document.getElementById("cy"),
    elements: [],
    style: [{
      selector: "node",
      style: {
        label: "data(name)",
        "background-color": "#60a5fa",
        "text-valign": "bottom",
        color: "#fff",
        "font-size": "10px"
      }
    }],
    layout: { name: "preset" }
  });

  cy.on("tap","node", e=>{
    selectedNodeData = e.target.data();
    renderNodeInfo(selectedNodeData);
    log(`[TARGET] ${selectedNodeData.name}`);
  });
}

/* ===============================
   CARGA ESCENARIO
   =============================== */
async function refreshBattlefield(){
  const res = await fetch(`${API_BASE}/hud/instances`);
  const data = await res.json();

  cy.elements().remove();

  (data.instances||[]).forEach((n,i)=>{
    cy.add({
      group:"nodes",
      data:{
        id:n.id,
        name:n.name,
        role:n.role,
        ip:n.ip,
        tools:n.tools||n.installed_tools||{},
        strategies: n.strategies || { attack: [], defense: [] }
      },
      position:{x:300+200*i,y:300}
    });
  });

  cy.fit();
}

document.addEventListener("DOMContentLoaded", ()=>{
  initCy();
  refreshBattlefield();
});
</script>
</body>
</html>
