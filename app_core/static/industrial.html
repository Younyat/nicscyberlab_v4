<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Industrial Scenario Editor</title>

    <!-- LIBRARIES -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.0/cytoscape.min.js"></script>
    <link rel="stylesheet" href="css/style-scenario.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        #feedback-terminal {
            line-height: 1.4;
        }
        #toast {
    position: fixed; /* Floats over content */
    top: 20px;
    bottom: auto; /* cancels the shared stylesheet's bottom:30px -- without this,
                     having both top and bottom set on a fixed element with no
                     explicit height stretches it to fill almost the whole viewport */
    left: 50%;
    right: auto;
    width: auto;
    min-width: 0;
    height: auto;
    transform: translateX(-50%) translateY(-100px); /* Hidden above */
    background: linear-gradient(135deg, #059669 0%, #064e3b 100%); /* Industrial green */
    color: white;
    padding: 12px 24px;
    border: none;
    border-radius: 8px;
    font-weight: bold;
    box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
    z-index: 9999;
    transition: transform 0.4s cubic-bezier(0.18, 0.89, 0.32, 1.28), opacity 0.4s;
    opacity: 0;
}

#toast.show {
    transform: translateX(-50%) translateY(0); /* Drops into position */
    opacity: 1;
}

    </style>

</head>

<body>

<div id="app-container" class="flex min-h-screen p-4 gap-4">

    <!-- =====================================================
         LEFT COLUMN: SCENARIO + TERMINAL
    ====================================================== -->
    <div class="flex-1 flex flex-col gap-4">

        <div class="scenario-header">
            <div class="brand">
                <div class="brand-icon"><i class="fas fa-industry"></i></div>
                <div>
                    <div class="brand-title">Industrial Scenario Editor</div>
                    <div class="brand-subtitle">PLC &bull; SCADA &bull; OT Integration</div>
                </div>
            </div>
        </div>

        <!-- CANVAS -->
        <div id="cy" style="height:560px;"></div>

        <!-- FEEDBACK TERMINAL -->
        <div id="terminal">
            <div class="terminal-titlebar">
                <div class="terminal-label"><i class="fas fa-terminal"></i> Feedback Terminal</div>
                <div class="flex items-center gap-3">
                    <div class="terminal-dots"><span></span><span></span><span></span></div>
                    <button onclick="clearFeedbackTerminal()"
                            class="text-xs px-3 py-1 rounded-md text-white"
                            style="background: var(--bg-input); border: 1px solid var(--border-color-strong);">
                        Clear
                    </button>
                </div>
            </div>

            <div id="feedback-terminal"
                 class="text-green-400 font-mono text-xs overflow-y-auto h-[calc(200px-64px)]"
                 style="background: var(--bg-canvas); border: 1px solid var(--border-color-light); border-radius: var(--radius-sm); padding: 0.85rem;">
                <div>[INFO] Terminal initialized</div>
            </div>
        </div>

    </div>

    <!-- =====================================================
         RIGHT COLUMN: CONTROL PANEL
    ====================================================== -->
    <div id="controls-panel" class="w-[34rem] flex flex-col gap-6">

        <!-- STATISTICS -->
        <div class="panel-card p-4">
            <h2 class="panel-section-title mb-3">Statistics</h2>
            <div class="flex justify-around text-center">
                <div class="stat-block">
                    <p class="stat-value stat-nodes" id="nodeCount">0</p>
                    <p class="stat-label">Nodes</p>
                </div>
                <div class="stat-block">
                    <p class="stat-value stat-edges" id="edgeCount">0</p>
                    <p class="stat-label">Connections</p>
                </div>
            </div>
        </div>

        <!-- INDUSTRIAL BUTTONS -->
        <div>
            <h2 class="panel-section-title mb-3">Quick Add</h2>
            <div class="grid grid-cols-2 gap-3">
                <button onclick="setIndustrialMode('plc')" class="btn-mode bg-orange-700/70 hover:bg-orange-600 text-white">
                    <i class="fas fa-microchip"></i>
                    <span>PLC</span>
                </button>
                <button onclick="setIndustrialMode('scada')" class="btn-mode bg-purple-700/70 hover:bg-purple-600 text-white">
                    <i class="fas fa-desktop"></i>
                    <span>SCADA</span>
                </button>
                <button class="btn-mode bg-blue-700/30 text-white/50 cursor-not-allowed" title="Coming soon">
                    <i class="fas fa-microchip"></i>
                    <span>IoT Device</span>
                </button>
                <button class="btn-mode bg-teal-700/30 text-white/50 cursor-not-allowed" title="Coming soon">
                    <i class="fas fa-project-diagram"></i>
                    <span>IoT Network</span>
                </button>
            </div>
        </div>

        <!-- CONNECTION AND DELETE -->
        <div class="flex gap-3">
            <button onclick="toggleConnectionMode()" class="btn-action" style="background: rgba(249,115,22,0.16); border-color: rgba(249,115,22,0.4); color: #fdba74;">
                <i class="fas fa-link"></i> Connect
            </button>
            <button onclick="deleteSelected()" class="btn-action btn-neutral">
                <i class="fas fa-trash-alt"></i> Delete
            </button>
        </div>

        <!-- INDUSTRIAL CONFIGURATION PANEL -->
        <div id="industrial-panel" class="panel-card p-6">
            <p class="text-gray-400 text-center">
                Select an industrial component to configure it
            </p>
        </div>

        <!-- SCENARIO INTEGRATION -->
        <div class="panel-card p-6">
            <h2 class="panel-section-title mb-5 text-center">
                Scenario Integration
            </h2>

            <div class="flex flex-col gap-3">
                <button onclick="loadScenario()" class="btn-action btn-primary-dim">
                    <i class="fas fa-upload"></i> Load Base Scenario
                </button>

                <button onclick="deleteIndustrialScenario()" class="btn-action btn-danger">
                    <i class="fas fa-trash-alt"></i> Delete Industrial Scenario
                </button>

                <button onclick="saveIndustrialScenario()" class="btn-action" style="background: linear-gradient(135deg, #059669, #047857); color: #fff;">
                    <i class="fas fa-save"></i> Save Industrial Scenario
                </button>
            </div>
        </div>

    </div>
</div>

<!-- TOAST -->
<div id="toast"></div>

<!-- JS -->
<script src="js/industrial.js"></script>
<script>
    // Run loadScenario when the page has fully loaded
    window.addEventListener('load', () => {
        // Check if the function exists in industrial.js to avoid errors
        if (typeof loadScenario === 'function') {
            console.log("Loading industrial scenario automatically...");
            loadScenario();
        }
    });
</script>
</body>
</html>
